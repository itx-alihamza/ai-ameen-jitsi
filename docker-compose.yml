# ==============================================================================
# Ameen self-hosted Jitsi Meet
#
# WHAT: the four services a Jitsi Meet deployment needs, and nothing else.
#
# WHY THIS IS A SEPARATE COMPOSE FILE, not part of the Ameen backend's
# docker-compose.yml: Jitsi is an independent system with its own lifecycle,
# upgrade cadence, and — critically — its own network requirements (a large UDP
# port for media, host-level networking for the videobridge). Folding it into the
# application stack would mean every `docker compose up` for a frontend change
# restarts a media server, and every Jitsi upgrade would risk the application
# database. They are deployed to different machines in production (see README
# §Deployment model), so they are separate stacks in development too.
#
# WHAT IS DELIBERATELY ABSENT:
#   - jibri     — recording and live streaming. Out of scope: Ameen stores no
#                 audio or video. Adding this service is what would make
#                 recording possible, so it is not here.
#   - jigasi    — SIP gateway and transcription bridge. Transcription is deferred
#                 to a later phase; no speech-to-text provider is installed.
#   - etherpad  — collaborative notes. Minutes live in Ameen, under its RBAC and
#                 approval workflow, not in an unauthenticated pad.
#   - a volume for media of any kind. The volumes below hold configuration and
#                 Prosody's certificates/authentication state only.
#
# UPGRADES: pin `JITSI_IMAGE_TAG` to a stable release and move it deliberately.
# All customization is via environment variables and Ameen-side
# `configOverwrite`, so no image is patched and `docker compose pull` is safe.
# ==============================================================================

# COMPOSE PROJECT NAME, pinned.
#
# WHY: Compose derives the project name from the directory, and this stack moved
# from `ai-ameen-migrated-backend/infra/jitsi/` to `ai-ameen-jitsi/`. Without this
# line the rename would change the prefix on every container and named volume
# (`jitsi_jitsi-prosody-config` → `ai-ameen-jitsi_jitsi-prosody-config`), which
# reads as "the volumes vanished": Prosody would re-register its components from
# scratch and the generated web config and certificates would be regenerated.
# Pinning the historical name is what makes the directory move a no-op for a
# running deployment.
name: jitsi

services:
  # ── Web frontend: nginx + the Jitsi Meet JavaScript app ───────────────────
  # Also serves `external_api.js`, which the Ameen frontend loads to embed the
  # conference. That is why this must be reachable over HTTPS from the browser:
  # a script blocked by mixed-content rules means a blank Live Meeting tab.
  web:
    image: jitsi/web:${JITSI_IMAGE_TAG:-stable-9955}
    restart: unless-stopped
    ports:
      # 80 is published only so an ACME HTTP-01 challenge can complete and so a
      # plain-HTTP request can be redirected. Never serve the app itself on it —
      # browsers refuse microphone and camera access outside a secure context.
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - jitsi-web-config:/config:Z
      - jitsi-web-transcripts:/usr/share/jitsi-meet/transcripts:Z
      - jitsi-web-crontabs:/var/spool/cron/crontabs:Z
      # Local development certificate, generated by ./generate-local-cert.sh.
      #
      # WHY A BIND MOUNT AND NOT THE IMAGE'S OWN SELF-SIGNED CERT: the jitsi/web
      # image does generate a fallback certificate when Let's Encrypt is off, but
      # its CN/SAN does not include `localhost`, so Chrome and Safari reject it
      # with ERR_CERT_COMMON_NAME_INVALID and refuse to load `external_api.js` —
      # which presents as a permanently blank Live Meeting tab. Supplying a cert
      # whose SANs actually cover `localhost` and `127.0.0.1` is what makes the
      # "accept the warning once" workflow possible at all.
      #
      # `./certs` is gitignored and the directory is created (empty) by the
      # script. Docker Compose tolerates mounting an empty host directory, so the
      # stack still starts if the script has not been run — the image then falls
      # back to its own cert and the browser warning is unavoidable.
      - ./certs:/config/keys:Z
    environment:
      - ENABLE_LETSENCRYPT=${ENABLE_LETSENCRYPT:-0}
      - LETSENCRYPT_DOMAIN=${JITSI_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - LETSENCRYPT_USE_STAGING=${LETSENCRYPT_USE_STAGING:-0}
      - PUBLIC_URL=${PUBLIC_URL}
      - TZ=${TZ:-Asia/Riyadh}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      - XMPP_BOSH_URL_BASE=${XMPP_BOSH_URL_BASE:-http://prosody:5280}
      - XMPP_GUEST_DOMAIN=${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      - XMPP_RECORDER_DOMAIN=${XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      # Ameen decides who may enter a room and who moderates it. These two turn
      # Prosody's token verification on; with them set, an anonymous browser that
      # somehow guesses a room name is still rejected at the XMPP layer.
      - ENABLE_AUTH=${ENABLE_AUTH:-1}
      - ENABLE_GUESTS=${ENABLE_GUESTS:-0}
      - AUTH_TYPE=${AUTH_TYPE:-jwt}
      - JWT_APP_ID=${JWT_APP_ID}
      - JWT_APP_SECRET=${JWT_APP_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JWT_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=${JWT_APP_ID}
      - JWT_ENABLE_DOMAIN_VERIFICATION=false
      # Recording and transcription: off, and off again. The Ameen join token
      # also denies both features per user, so three independent settings would
      # have to change before any capture were possible.
      - ENABLE_RECORDING=0
      - ENABLE_FILE_RECORDING_SERVICE=0
      - ENABLE_LIVESTREAMING=0
      - ENABLE_TRANSCRIPTIONS=0
      - ENABLE_SERVICE_RECORDING=0
      # Browser-side "local recording": a participant recording their own audio and
      # downloading it. It writes nothing to the server, but it is still recording,
      # and the image's template defaults it to ENABLED
      # (`DISABLE_LOCAL_RECORDING | default "false"` in settings-config.js) — so
      # leaving it unset produces `config.localRecording.disable = false` in the
      # generated client config.
      #
      # Ameen's own `configOverwrite` already switches it off for the embedded
      # frame, but that only covers participants who arrive through Ameen. A
      # moderator holding a valid token could open the room URL directly and get
      # the server default instead. Setting it here closes that path, which is the
      # difference between "the UI hides it" and "the deployment does not offer it".
      - DISABLE_LOCAL_RECORDING=true
      # The lobby is the in-call complement to Ameen's authorization: a moderator
      # can hold an unexpected participant rather than discovering them mid-item.
      - ENABLE_LOBBY=1
      - ENABLE_PREJOIN_PAGE=0
      # Ameen's own page is the branded surface; the embedded frame should not
      # promote Jitsi or offer its own invite flow.
      - DISABLE_DEEP_LINKING=1
      - ENABLE_WELCOME_PAGE=0
      - ENABLE_CLOSE_PAGE=0
      # Ameen is the authorization boundary; Jitsi must never phone home about
      # who joined what.
      - ENABLE_STATS_ID=0
      - DISABLE_HTTPS=${DISABLE_HTTPS:-0}
      - ENABLE_HTTP_REDIRECT=${ENABLE_HTTP_REDIRECT:-1}
      # Ameen embeds the conference in an iframe on its own origin, so that origin
      # must be allowed to frame this host. Set to the Ameen frontend origin.
      - ENABLE_IPV6=${ENABLE_IPV6:-0}
    networks:
      jitsi:
        aliases:
          - ${XMPP_DOMAIN:-meet.jitsi}
    healthcheck:
      # nginx serving the app root is the meaningful liveness signal: the
      # container can be up while nginx has failed to start.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      prosody:
        condition: service_healthy

  # ── Prosody: the XMPP server. Signalling and authentication. ──────────────
  # This is where JWT verification actually happens, which makes it the security-
  # relevant service: `JWT_APP_SECRET` here must equal `JITSI_JWT_APP_SECRET` in
  # the Ameen backend, and must never be given to a browser.
  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_TAG:-stable-9955}
    restart: unless-stopped
    expose:
      - '5222'
      - '5347'
      - '5280'
    volumes:
      - jitsi-prosody-config:/config:Z
      - jitsi-prosody-plugins:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-jwt}
      - ENABLE_AUTH=${ENABLE_AUTH:-1}
      - ENABLE_GUESTS=${ENABLE_GUESTS:-0}
      - ENABLE_LOBBY=1
      - ENABLE_RECORDING=0
      - ENABLE_TRANSCRIPTIONS=0
      - GLOBAL_MODULES=${GLOBAL_MODULES:-}
      - JWT_APP_ID=${JWT_APP_ID}
      - JWT_APP_SECRET=${JWT_APP_SECRET}
      - JWT_ACCEPTED_ISSUERS=${JWT_APP_ID}
      - JWT_ACCEPTED_AUDIENCES=${JWT_APP_ID}
      - JWT_ALLOW_EMPTY=0
      - JWT_AUTH_TYPE=token
      - JWT_ENABLE_DOMAIN_VERIFICATION=false
      - JWT_TOKEN_AUTH_MODULE=token_verification
      - PUBLIC_URL=${PUBLIC_URL}
      - TZ=${TZ:-Asia/Riyadh}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      - XMPP_GUEST_DOMAIN=${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      - XMPP_RECORDER_DOMAIN=${XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      - XMPP_MODULES=${XMPP_MODULES:-}
      - XMPP_MUC_MODULES=${XMPP_MUC_MODULES:-}
      - XMPP_INTERNAL_MUC_MODULES=${XMPP_INTERNAL_MUC_MODULES:-}
      # Internal service credentials. Not user-facing, but a weak value here lets
      # anything that reaches the internal network register as a component and
      # observe or disrupt every conference. Generate them — see README §Secrets.
      - JICOFO_AUTH_USER=${JICOFO_AUTH_USER:-focus}
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=${JVB_AUTH_USER:-jvb}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
    networks:
      jitsi:
        aliases:
          - ${XMPP_SERVER:-xmpp.meet.jitsi}
    healthcheck:
      # Prosody's BOSH endpoint answering is what the web container waits on.
      test: ['CMD-SHELL', 'prosodyctl --config /config/prosody.cfg.lua status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Jicofo: conference focus. Allocates bridges and manages roles. ────────
  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_TAG:-stable-9955}
    restart: unless-stopped
    volumes:
      - jitsi-jicofo-config:/config:Z
    environment:
      - AUTH_TYPE=${AUTH_TYPE:-jwt}
      - ENABLE_AUTH=${ENABLE_AUTH:-1}
      - ENABLE_RECORDING=0
      - ENABLE_TRANSCRIPTIONS=0
      - JICOFO_AUTH_USER=${JICOFO_AUTH_USER:-focus}
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JICOFO_ENABLE_HEALTH_CHECKS=1
      - JVB_BREWERY_MUC=${JVB_BREWERY_MUC:-jvbbrewery}
      - TZ=${TZ:-Asia/Riyadh}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
    networks:
      - jitsi
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8888/about/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      prosody:
        condition: service_healthy

  # ── JVB: the videobridge. Carries the actual audio and video. ─────────────
  # THIS is the service with the unusual networking requirement, and the one that
  # makes a PaaS unsuitable: it needs a single UDP port reachable from every
  # participant's network, and it must advertise an address those participants can
  # actually route to. Media passes through RAM and is never written to disk —
  # there is no recording sink configured, and no volume that could hold one.
  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_TAG:-stable-9955}
    restart: unless-stopped
    ports:
      # Bound to all interfaces on purpose: for a second participant on another
      # device to receive media, this port must be reachable at the address in
      # DOCKER_HOST_ADDRESS — which on a laptop is the LAN address, not 127.0.0.1.
      - '${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp'
    volumes:
      - jitsi-jvb-config:/config:Z
    environment:
      - DOCKER_HOST_ADDRESS=${DOCKER_HOST_ADDRESS}
      - JVB_ADVERTISE_IPS=${JVB_ADVERTISE_IPS:-}
      - JVB_AUTH_USER=${JVB_AUTH_USER:-jvb}
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=${JVB_BREWERY_MUC:-jvbbrewery}
      - JVB_PORT=${JVB_PORT:-10000}
      - JVB_ENABLE_APIS=${JVB_ENABLE_APIS:-rest,colibri}
      - PUBLIC_URL=${PUBLIC_URL}
      - TZ=${TZ:-Asia/Riyadh}
      - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
    networks:
      - jitsi
    healthcheck:
      # JVB's own health endpoint reports whether it has registered with Prosody
      # and can accept conferences — a stronger signal than "process alive".
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8080/about/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      prosody:
        condition: service_healthy

  # ── Jigasi: the transcription gateway (LIVE TRANSCRIPTION ONLY) ───────────
  #
  # Behind a compose profile, so `docker compose up -d` does NOT start it. Bring
  # it up deliberately:
  #     docker compose --profile transcription up -d
  #
  # WHAT IT IS FOR, AND WHAT IT IS NOT: Jigasi joins a conference as a hidden
  # participant and streams the mixed audio to Ameen over a WebSocket, where it
  # is forwarded to Speechmatics and returned as TEXT. It is the only supported
  # way to get conference audio server-side without running a browser per
  # meeting.
  #
  # It is NOT a recorder. `JIGASI_TRANSCRIBER_RECORD_AUDIO=false` and
  # `JIGASI_TRANSCRIBER_ENABLE_SAVING=0` are load-bearing: the image would
  # otherwise write .wav files and .txt transcripts to its own disk, which is
  # exactly the audio storage Ameen does not do. Ameen persists transcript text
  # to database rows and nothing else. There is deliberately no volume mounted
  # here that could hold media.
  #
  # SIP is off (`ENABLE_SIP=false` in the image's transcriber profile), so this
  # adds no telephony surface.
  jigasi:
    image: jitsi/jigasi:${JITSI_IMAGE_TAG:-stable-9955}
    profiles: ['transcription']
    restart: unless-stopped
    volumes:
      # Configuration only. No transcripts directory and no audio directory are
      # mounted on purpose — see above.
      - jitsi-jigasi-config:/config:Z
    environment:
      - ENABLE_AUTH=${ENABLE_AUTH:-1}
      - XMPP_AUTH_DOMAIN=${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      - XMPP_DOMAIN=${XMPP_DOMAIN:-meet.jitsi}
      - XMPP_MUC_DOMAIN=${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      - XMPP_INTERNAL_MUC_DOMAIN=${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      - XMPP_SERVER=${XMPP_SERVER:-xmpp.meet.jitsi}
      - XMPP_PORT=${XMPP_PORT:-5222}
      - PUBLIC_URL=${PUBLIC_URL}
      - TZ=${TZ:-Asia/Riyadh}
      # Component credentials. Generated by ./generate-secrets.sh alongside the
      # jicofo/jvb pair; a weak value here lets anything on the internal network
      # register as the transcriber and receive every conference's audio.
      - JIGASI_XMPP_USER=${JIGASI_XMPP_USER:-jigasi}
      - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD}
      - JIGASI_TRANSCRIBER_USER=${JIGASI_TRANSCRIBER_USER:-transcriber}
      - JIGASI_TRANSCRIBER_PASSWORD=${JIGASI_TRANSCRIBER_PASSWORD}
      - XMPP_HIDDEN_DOMAIN=${XMPP_HIDDEN_DOMAIN:-hidden.meet.jitsi}
      - JIGASI_BREWERY_MUC=${JIGASI_BREWERY_MUC:-jigasibrewery}
      # ── The bridge itself ──────────────────────────────────────────────────
      # VoskTranscriptionService is a generic WebSocket streaming client, not
      # Vosk-specific: it sends raw PCM (s16le mono 16 kHz) and reads
      # {"partial":...} / {"text":...} JSON back. Ameen implements that protocol
      # in transcription-ingest.server.ts. Confirmed by reading the class out of
      # this exact image tag rather than from documentation.
      - JIGASI_TRANSCRIBER_CUSTOM_SERVICE=org.jitsi.jigasi.transcription.VoskTranscriptionService
      # Points at the Ameen backend. `${MEETING_ID}` is NOT substituted by Jigasi
      # — see README §Live transcription for the per-room limitation this leaves.
      - JIGASI_TRANSCRIBER_VOSK_WEBSOCKET_URL=${TRANSCRIPTION_WEBSOCKET_URL}
      # ── Recording and on-disk saving: OFF, and not overridable per env ─────
      - JIGASI_TRANSCRIBER_RECORD_AUDIO=false
      - JIGASI_TRANSCRIBER_ENABLE_SAVING=0
      - JIGASI_TRANSCRIBER_SEND_TXT=false
      - JIGASI_TRANSCRIBER_ADVERTISE_URL=false
    networks:
      - jitsi
    depends_on:
      prosody:
        condition: service_healthy

networks:
  jitsi:
    driver: bridge

# Named volumes, not bind mounts: the image generates its configuration and
# Prosody's certificates on first boot, and those must survive a container
# replacement or every restart invalidates existing sessions.
#
# NOTE ON `jitsi-web-transcripts`: the image declares this path whether or not
# transcription is enabled. With ENABLE_TRANSCRIPTIONS=0 and no jigasi service,
# nothing ever writes to it. It is NOT a media store and holds no audio or video.
volumes:
  jitsi-web-config:
  jitsi-web-transcripts:
  jitsi-web-crontabs:
  jitsi-prosody-config:
  jitsi-prosody-plugins:
  jitsi-jicofo-config:
  jitsi-jvb-config:
  jitsi-jigasi-config:
